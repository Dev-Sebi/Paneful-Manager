name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Dry run for this tag (must be v<package.json version>); builds the selected ref and uploads workflow artifacts only
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  package:
    needs: checks
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # No dependency cache: the pnpm store's side-effects cache could hand a restored pty.node into the release.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: pnpm install --frozen-lockfile
      - name: Verify the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag '$TAG' does not match the package.json version (expected v$version)"
            exit 1
          fi
      - name: Pack the release
        run: sh scripts/release-pack.sh --tag "$TAG" --out dist/release
      - name: Smoke-test the tarball
        run: sh scripts/release-smoke.sh "dist/release/paneful-manager-$TAG.tar.gz" 17337
      - name: Collect the release assets
        run: |
          cp install.sh dist/release/install.sh
          ls -l dist/release
          cat "dist/release/paneful-manager-$TAG.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.TAG }}
          path: |
            dist/release/paneful-manager-${{ env.TAG }}.tar.gz
            dist/release/paneful-manager-${{ env.TAG }}.tar.gz.sha256
            dist/release/install.sh
          if-no-files-found: error
          retention-days: 7

  release:
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.ref_name }}
          path: release
      - name: Create the GitHub release
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum -c "paneful-manager-$TAG.tar.gz.sha256"
          set --
          case "$TAG" in *-*) set -- --prerelease ;; esac
          gh release create "$TAG" --verify-tag --title "Paneful Manager $TAG" --generate-notes "$@" \
            "paneful-manager-$TAG.tar.gz" "paneful-manager-$TAG.tar.gz.sha256" install.sh
