name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Dry run for this tag (must be v<package.json version>); builds the selected ref and uploads workflow artifacts only
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  # One tarball per target with the node-pty addon of its platform, packed and smoke-tested on that platform.
  package:
    needs: checks
    strategy:
      # One failing platform must not cancel the others, so each result stays visible.
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # pnpm/action-setup's self-installer fails on the macos-15-intel runner; npm installs the pinned version everywhere.
      - name: Install pnpm
        run: npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      # No dependency cache: the pnpm store's side-effects cache could hand a restored pty.node into the release.
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - run: pnpm install --frozen-lockfile
      - name: Verify the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag '$TAG' does not match the package.json version (expected v$version)"
            exit 1
          fi
      - name: Pack the release
        run: sh scripts/release-pack.sh --tag "$TAG" --target "$TARGET" --out dist/release
      # install.sh --no-service, then the server is started by hand: the runners get no systemd unit or launchd agent.
      - name: Smoke-test the tarball
        run: sh scripts/release-smoke.sh "dist/release/paneful-manager-$TAG-$TARGET.tar.gz" 17337
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.TAG }}-${{ matrix.target }}
          path: |
            dist/release/paneful-manager-${{ env.TAG }}-${{ matrix.target }}.tar.gz
            dist/release/paneful-manager-${{ env.TAG }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  # The generic tarball (no node_modules, install.sh compiles node-pty) for every other system, plus both installers.
  package-generic:
    needs: checks
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # pnpm/action-setup's self-installer fails on the macos-15-intel runner; npm installs the pinned version everywhere.
      - name: Install pnpm
        run: npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - run: pnpm install --frozen-lockfile
      - name: Pack the generic tarball
        run: sh scripts/release-pack.sh --tag "$TAG" --no-deps --out dist/release
      - name: Collect the installers
        run: |
          cp install.sh install.ps1 dist/release/
          ls -l dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.TAG }}-generic
          path: |
            dist/release/paneful-manager-${{ env.TAG }}.tar.gz
            dist/release/paneful-manager-${{ env.TAG }}.tar.gz.sha256
            dist/release/install.sh
            dist/release/install.ps1
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [package, package-generic]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-${{ github.ref_name }}-*
          merge-multiple: true
          path: release
      - name: Create the GitHub release
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set --
          for name in linux-x64 linux-arm64 darwin-arm64 darwin-x64 ""; do
            tarball="paneful-manager-$TAG${name:+-$name}.tar.gz"
            sha256sum -c "$tarball.sha256"
            set -- "$@" "$tarball" "$tarball.sha256"
          done
          case "$TAG" in *-*) set -- --prerelease "$@" ;; esac
          gh release create "$TAG" --verify-tag --title "Paneful Manager $TAG" --generate-notes "$@" install.sh install.ps1
