# Example workspace preset with two tabs. Copy to ~/.config/paneful-manager/workspaces/ and adapt.
name: two-projects
tabs:
  - title: grid
    layout: grid-2x2
    panes:
      - cwd: ~/git/project1
        command: claude
      - cwd: ~/git/project1
        command: claude
      - cwd: ~/git/project1
        command: claude
      - cwd: ~/git/project1
        command: claude
  - title: single
    layout: single
    panes:
      - cwd: ~/git/project2
        command: claude
