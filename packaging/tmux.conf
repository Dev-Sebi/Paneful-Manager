# tmux config for the dedicated Agent Hub server (tmux -L agent-hub), written by install.sh.
# tmux reads it only at server start: restart agent-hub-tmux.service to apply changes (ends all sessions).
set -s exit-empty off
set -g remain-on-exit on
set -g status off
set -g history-limit 50000
set -g window-size latest
set -as terminal-overrides ',xterm-256color:smcup@:rmcup@'
