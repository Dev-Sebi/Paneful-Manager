# tmux config for the dedicated Paneful Manager server (tmux -L paneful-manager), written by install.sh.
# tmux reads it only at server start: restart paneful-manager-tmux.service to apply changes (ends all sessions).
set -s exit-empty off
set -g remain-on-exit on
set -g status off
set -g history-limit 50000
set -g window-size latest
set -as terminal-overrides ',xterm-256color:smcup@:rmcup@'
